<!doctype html>
<html lang="pt-BR" data-theme="studio" data-language="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#7b2432" />
    <meta name="description" content="Two Eyes On You — estúdio responsável por Arcanian: Devaneios, Menos Um, Tormenta e Jogo." />
    <link rel="icon" href="./favicon.ico" />
    <script>
      (function () {
        try {
          var version = localStorage.getItem('teoy-theme-version');
          var theme = version === '12' ? (localStorage.getItem('teoy-theme') || 'studio') : 'studio';
          var language = localStorage.getItem('teoy-language') || 'pt';
          var htmlLanguages = { pt: 'pt-BR', en: 'en', es: 'es', it: 'it', ja: 'ja' };
          document.documentElement.dataset.theme = theme;
          document.documentElement.dataset.language = language;
          document.documentElement.lang = htmlLanguages[language] || 'pt-BR';
        } catch (_) {}
      }());
    </script>
    <title>Two Eyes On You Studios</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
